name: ghmodels-test
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: vision via GitHub Models with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          img = base64.b64encode(urllib.request.urlopen("https://picsum.photos/id/1027/640/800", timeout=20).read()).decode()
          prompt = "Rate the person in the photo. Return ONLY a JSON object with keys: is_woman (true/false), feminine (0-10), body (slim|athletic|average|curvy|plus), face (0-10), photo_quality (0-10), curves (0-10), in_shape (true/false)."
          for model in ["openai/gpt-4o-mini", "openai/gpt-4.1-mini", "openai/gpt-4.1-nano", "openai/gpt-4o", "meta/Llama-3.2-11B-Vision-Instruct", "meta/Llama-3.2-90B-Vision-Instruct", "microsoft/Phi-4-multimodal-instruct", "mistral-ai/mistral-medium-2505"]:
              body = {"model": model, "temperature": 0, "max_tokens": 300, "messages": [{"role": "user", "content": [{"type": "text", "text": prompt}, {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64," + img, "detail": "low"}}]}]}
              req = urllib.request.Request("https://models.github.ai/inference/chat/completions", data=json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode(); hdr = {k: v for k, v in r.headers.items() if "ratelimit" in k.lower()}
                  try: out = json.loads(raw)["choices"][0]["message"]["content"][:160].replace("\n", " ")
                  except Exception: out = "RAW " + raw[:160]
                  print(f"GHM {model} {time.time()-t:.1f}s :: {out} :: {hdr}", flush=True)
              except urllib.error.HTTPError as e:
                  print(f"GHM {model} HTTP {e.code} {e.read().decode()[:200]}", flush=True)
              except Exception as e:
                  print(f"GHM {model} ERR {str(e)[:120]}", flush=True)
          PY
